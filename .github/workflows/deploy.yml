name: Deploy Static Website to S3

on:
  push:
    branches:
      - main

# Required for AWS OIDC authentication
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::810639563432:role/GitHubActions-S3Deploy-Role
          aws-region: us-east-1
          audience: sts.amazonaws.com

      # If you use a build step (React, Vue, Vite, Hugo, etc.), uncomment and run it here:
      # - name: Setup Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      # - run: npm ci
      # - run: npm run build

      - name: Sync files to S3 bucket
        run: |
          # If pure static files are in the repository root:
          aws s3 sync . s3://tcr-livestream-s3-webhosting-gha-deploy-demo --delete --exclude ".git/*" --exclude ".github/*"
          
          # OR if using a build artifact folder like ./dist or ./build:
          # aws s3 sync ./dist s3://${{ secrets.S3_BUCKET_NAME }} --delete
